name: ROM navigation

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          python-version: "3.12"
      - name: Install ROM and test dependencies
        run: uv sync --frozen --only-group rom --only-group dev --no-install-project
      - name: Navigation and lease contracts
        run: |
          PYTHONPATH=src uv run --no-sync python -m pytest \
            tests/test_rom_navigation_api.py \
            tests/test_rom_navigation_lifecycle.py \
            tests/test_rom_navigation_contracts.py \
            tests/test_rom_navigation_vision.py \
            tests/test_rom_sensor_odometry.py \
            tests/test_rom_tof.py -q
      - name: Child stop handoff
        run: |
          PYTHONPATH=src uv run --no-sync python -m pytest \
            tests/test_rom_runtime_child.py \
            -k 'stop_immediately_after_ack or blocked_continuous_sample_retires_transport' -q
